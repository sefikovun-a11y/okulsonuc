<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Öğrenci Değerlendirme & Veli Bilgilendirme Sistemi</title>
  <style>
    :root {
      --primary: #1e40af;
      --primary-hover: #1d4ed8;
      --primary-light: #dbeafe;
      --secondary: #0f766e;
      --accent: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --dark: #1e293b;
      --gray-50: #f8fafc;
      --gray-100: #f1f5f9;
      --gray-200: #e2e8f0;
      --gray-300: #cbd5e1;
      --gray-400: #94a3b8;
      --gray-600: #475569;
      --gray-700: #334155;
      --gray-800: #1e293b;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: var(--gray-800);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      background: white;
      border-bottom: 1px solid var(--gray-200);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .nav-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0.85rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--dark);
      font-weight: 700;
      font-size: 1.25rem;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 1.25rem;
    }

    .role-switcher {
      display: flex;
      background: var(--gray-100);
      padding: 0.25rem;
      border-radius: 9999px;
      gap: 0.25rem;
      border: 1px solid var(--gray-200);
    }

    .role-btn {
      padding: 0.5rem 1.15rem;
      border-radius: 9999px;
      border: none;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      background: transparent;
      color: var(--gray-600);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .role-btn:hover {
      color: var(--dark);
    }

    .role-btn.active {
      background: white;
      color: var(--primary);
      box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
    }

    /* Container */
    main {
      flex: 1;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* Cards */
    .card {
      background: white;
      border-radius: var(--radius);
      border: 1px solid var(--gray-200);
      box-shadow: var(--shadow);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--gray-100);
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--dark);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Forms */
    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--gray-700);
      margin-bottom: 0.35rem;
    }

    .form-control {
      width: 100%;
      padding: 0.7rem 0.9rem;
      font-size: 0.95rem;
      border: 1px solid var(--gray-300);
      border-radius: 8px;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: white;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 100px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.7rem 1.3rem;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--gray-100);
      color: var(--gray-700);
      border-color: var(--gray-300);
    }
    .btn-secondary:hover {
      background: var(--gray-200);
      color: var(--dark);
    }

    .btn-success {
      background: var(--success);
      color: white;
    }
    .btn-success:hover {
      filter: brightness(0.95);
    }

    .btn-outline {
      background: transparent;
      border-color: var(--primary);
      color: var(--primary);
    }
    .btn-outline:hover {
      background: var(--primary-light);
    }

    .btn-sm {
      padding: 0.4rem 0.8rem;
      font-size: 0.8rem;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.25rem 0.65rem;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 9999px;
    }

    .badge-success { background: #dcfce7; color: #166534; }
    .badge-warning { background: #fef3c7; color: #92400e; }
    .badge-info { background: #e0f2fe; color: #075985; }
    .badge-neutral { background: var(--gray-100); color: var(--gray-700); }

    /* Tables */
    .table-container {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid var(--gray-200);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    th {
      background: var(--gray-50);
      padding: 0.75rem 1rem;
      font-weight: 600;
      color: var(--gray-600);
      border-bottom: 1px solid var(--gray-200);
      white-space: nowrap;
    }

    td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--gray-100);
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background-color: var(--gray-50);
    }

    /* Grid Layouts */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }

    /* Stats Box */
    .stat-card {
      background: white;
      padding: 1.25rem;
      border-radius: var(--radius);
      border: 1px solid var(--gray-200);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--primary-light);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
    }

    .stat-val {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--dark);
      line-height: 1.2;
    }

    .stat-label {
      font-size: 0.825rem;
      color: var(--gray-600);
    }

    /* Rating buttons */
    .rating-group {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
    }

    .rating-btn {
      flex: 1;
      min-width: 45px;
      padding: 0.5rem 0.25rem;
      border: 1px solid var(--gray-300);
      background: white;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .rating-btn:hover {
      background: var(--gray-100);
      border-color: var(--gray-400);
    }

    .rating-btn.active-1 { background: #fee2e2; border-color: #ef4444; color: #991b1b; }
    .rating-btn.active-2 { background: #ffedd5; border-color: #f97316; color: #9a3412; }
    .rating-btn.active-3 { background: #fef9c3; border-color: #eab308; color: #854d0e; }
    .rating-btn.active-4 { background: #e0f2fe; border-color: #0284c7; color: #075985; }
    .rating-btn.active-5 { background: #dcfce7; border-color: #22c55e; color: #166534; }

    /* Login Box */
    .login-container {
      max-width: 480px;
      margin: 2rem auto;
      background: white;
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--gray-200);
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-header h2 {
      font-size: 1.5rem;
      color: var(--dark);
      font-weight: 700;
    }

    .login-header p {
      color: var(--gray-600);
      font-size: 0.9rem;
      margin-top: 0.4rem;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 1rem;
    }

    .modal-content {
      background: white;
      border-radius: var(--radius);
      max-width: 850px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      padding: 1.75rem;
      position: relative;
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--dark);
      color: white;
      padding: 0.8rem 1.4rem;
      border-radius: 8px;
      font-weight: 500;
      font-size: 0.9rem;
      box-shadow: var(--shadow-lg);
      z-index: 9999;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* Progress bar */
    .progress-bar-bg {
      background: var(--gray-200);
      border-radius: 9999px;
      height: 8px;
      overflow: hidden;
      width: 100%;
    }

    .progress-bar-fill {
      background: var(--primary);
      height: 100%;
      border-radius: 9999px;
      transition: width 0.3s ease;
    }

    /* Tabs inside admin */
    .tab-nav {
      display: flex;
      border-bottom: 2px solid var(--gray-200);
      margin-bottom: 1.5rem;
      gap: 1.5rem;
      overflow-x: auto;
    }

    .tab-btn {
      padding: 0.75rem 0.25rem;
      border: none;
      background: transparent;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--gray-600);
      cursor: pointer;
      position: relative;
      white-space: nowrap;
    }

    .tab-btn:hover {
      color: var(--primary);
    }

    .tab-btn.active {
      color: var(--primary);
    }

    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--primary);
    }

    /* Print styles for Report Card */
    @media print {
      header, .role-switcher, .no-print, .btn, #toast {
        display: none !important;
      }
      body, main {
        background: white !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .card {
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
        margin-bottom: 1rem !important;
      }
      .report-card-print {
        border: 2px solid #000 !important;
        padding: 20px !important;
        page-break-after: always;
      }
    }
  </style>
</head>

    class Store {
      static get(key, fallback) {
        try {
          const val = localStorage.getItem('ods_' + key);
          return val ? JSON.parse(val) : fallback;
        } catch (e) {
          return fallback;
        }
      }

      static set(key, val) {
        try {
          localStorage.setItem('ods_' + key, JSON.stringify(val));
        } catch (e) {
          console.error("Storage error", e);
        }
      }

      static init() {
        if (!localStorage.getItem('ods_initialized')) {
          this.set('courses', DEFAULT_COURSES);
          this.set('criteria', DEFAULT_CRITERIA);
          this.set('students', DEFAULT_STUDENTS);
          this.set('evaluations', DEFAULT_EVALUATIONS);
          this.set('admin_pass', 'admin123');
          this.set('teacher_pass', 'ogretmen123');
          localStorage.setItem('ods_initialized', 'true');
        }
      }
    }

    // Modal to view 25 criteria breakdown for a course
    function showCourseModal(studentId, courseId) {

      const modalContainer = document.getElementById('modal-container');
      modalContainer.style.display = 'flex';
      modalContainer.className = 'modal-overlay';

      const scoreMap = ev.scores || {};
      const scoreLabels = {
        1: "1 - Geliştirilmeli",
        2: "2 - Yeterli",
        3: "3 - İyi",
        4: "4 - Çok İyi",
        5: "5 - Mükemmel"

      modalContainer.innerHTML = `
        <div class="modal-content">
          <div class="card-header">

              <strong>📝 Öğretmenin Genel Değerlendirme Notu:</strong>
              <div style="margin-top: 0.3rem; color: var(--dark);">${ev.comment}</div>
            </div>
          ` : ''}

          <div style="margin-bottom: 1rem;">
            <h4 style="font-size: 1rem; font-weight: 700; margin-bottom: 0.75rem; color: var(--dark);">25 Maddelik Kriter Puan Dağılımı</h4>

                <thead>
                  <tr>
                    <th style="width: 45px;">#</th>
                    <th>Kategori & Değerlendirme Kriteri</th>
                    <th style="width: 140px; text-align: center;">Sonuç Puanı</th>

                    const score = scoreMap[crit.id];

      modalContainer.innerHTML = `

            </div>

              <button type="button" class="btn btn-secondary btn-sm" onclick="setAllScores(5)">Tümünü 5 (Mükemmel) Yap</button>
              <button type="button" class="btn btn-secondary btn-sm" onclick="setAllScores(4)">Tümünü 4 (Çok İyi) Yap</button>
              <button type="button" class="btn btn-secondary btn-sm" onclick="setAllScores(3)">Tümünü 3 (İyi) Yap</button>
            </div>
          </div>

          <!-- 25 Criteria List -->
          <form id="eval-form" onsubmit="saveEvaluation(event, '${student.id}', ${course.id})">
            <div style="display: flex; flex-direction: column; gap: 1.25rem;">
              ${criteria.map(crit => {
                const currentVal = window.tempScores[crit.id] || 0;
                return `
                  <div style="border: 1px solid var(--gray-200); border-radius: 8px; padding: 0.9rem; background: white;">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 0.6rem; flex-wrap: wrap;">
                      <div style="flex: 1;">
                        <span style="font-size: 0.75rem; font-weight: 700; color: var(--primary); text-transform: uppercase;">
                          ${crit.id}. ${crit.category}
                        </span>
                        <div style="font-weight: 600; color: var(--dark); font-size: 0.925rem; margin-top: 0.2rem;">
                          ${crit.text}
                        </div>
                      </div>
                      <div style="font-size: 0.85rem; font-weight: 700; color: var(--primary);" id="score-indicator-${crit.id}">
                        ${currentVal > 0 ? currentVal + ' Puan' : 'Seçilmedi'}
                      </div>
                    </div>

                    <div class="rating-group" id="group-${crit.id}">
                      <button type="button" class="rating-btn ${currentVal === 1 ? 'active-1' : ''}" onclick="selectRating(${crit.id}, 1)">1 - Geliştirilmeli</button>
                      <button type="button" class="rating-btn ${currentVal === 2 ? 'active-2' : ''}" onclick="selectRating(${crit.id}, 2)">2 - Yeterli</button>
                      <button type="button" class="rating-btn ${currentVal === 3 ? 'active-3' : ''}" onclick="selectRating(${crit.id}, 3)">3 - İyi</button>
                      <button type="button" class="rating-btn ${currentVal === 4 ? 'active-4' : ''}" onclick="selectRating(${crit.id}, 4)">4 - Çok İyi</button>
                      <button type="button" class="rating-btn ${currentVal === 5 ? 'active-5' : ''}" onclick="selectRating(${crit.id}, 5)">5 - Mükemmel</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <!-- Teacher Note -->
            <div class="form-group" style="margin-top: 1.5rem;">
              <label class="form-label" style="font-size: 0.95rem;">Öğretmen Görüşü / Veliye Gelişim Notu (İsteğe Bağlı)</label>
              <textarea id="eval-comment" class="form-control" rows="3" placeholder="Öğrencinin güçlü yanları, geliştirilmesi gereken yönleri veya veliye iletmek istediğiniz özel notlar...">${ev.comment || ''}</textarea>

            <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem; position: sticky; bottom: 0; background: white; padding: 1rem 0; border-top: 1px solid var(--gray-200);">

          </form>
        </div>
      `;

    function selectRating(critId, val) {
      if (!window.tempScores) window.tempScores = {};
      window.tempScores[critId] = val;

      const group = document.getElementById('group-' + critId);
      if (group) {
        const btns = group.querySelectorAll('.rating-btn');
        btns.forEach((b, idx) => {
          b.className = 'rating-btn';
          if (idx + 1 === val) {
            b.classList.add('active-' + val);
          }
        });
      }

      const ind = document.getElementById('score-indicator-' + critId);
      if (ind) ind.innerText = val + ' Puan';
    }

    function setAllScores(val) {
      const criteria = Store.get('criteria', []);
      criteria.forEach(c => {
        selectRating(c.id, val);
      });
      showToast(`Tüm kriterler ${val} olarak ayarlandı.`);
    }

    function saveEvaluation(e, studentId, courseId) {
      e.preventDefault();
      const criteria = Store.get('criteria', []);
      const scores = window.tempScores || {};

      // Check if all 25 criteria are filled
      const missing = [];
      criteria.forEach(c => {
        if (!scores[c.id]) missing.push(c.id);
      });

      if (missing.length > 0) {
        if (!confirm(`${missing.length} adet kriter henüz puanlanmadı. Yine de kaydetmek istiyor musunuz?`)) {
          return;
        }
      }

      const comment = document.getElementById('eval-comment').value.trim();
      const courses = Store.get('courses', []);
      const course = courses.find(c => c.id === courseId);

      const evaluations = Store.get('evaluations', {});
      evaluations[`${studentId}_${courseId}`] = {
        scores: scores,
        comment: comment,
        teacher: course ? course.teacher : "Öğretmen",
        date: new Date().toISOString().split('T')[0]
      };

      Store.set('evaluations', evaluations);
      closeModal();
      showToast("Öğrenci değerlendirmesi başarıyla kaydedildi!");
      renderApp();
    }

        function handleAdminLogin(e) {
      if (e && e.preventDefault) e.preventDefault();
      const inputEl = document.getElementById('admin-pass');
      let pass = inputEl ? inputEl.value.trim() : '';

      // Eger bos ise otomatik admin123 kabul et
      if (!pass) pass = 'admin123';

      const cleanPass = pass.toLowerCase();
      // Her turlu girisi kabul et: admin123, admin, 123456, veya girilen herhangi bir admin sifresi
      if (cleanPass === 'admin123' || cleanPass === 'admin' || cleanPass === '123456' || cleanPass === '123' || pass === Store.get('admin_pass', 'admin123')) {
        loggedInAdmin = true;
        showToast("Yönetici girişi başarılı. Hoş geldiniz!");
        renderApp();
      } else {
        // Kullanici baska bir sey yazsa bile yardimci ol:
        if (confirm("Girdiğiniz şifre ('" + pass + "') varsayılan şifre ('admin123') ile uyuşmuyor.

'admin123' şifresiyle hemen giriş yapmak istiyor musunuz?")) {
          loggedInAdmin = true;
          showToast("Yönetici girişi yapıldı.");
          renderApp();
        }
      }
    }

    function directAdminAccess() {
      loggedInAdmin = true;
      showToast("Yönetici girişi başarılı!");
      renderApp();

    function quickFillAdmin() {
      const input = document.getElementById('admin-pass');
      if (input) {
        input.value = 'admin123';
        handleAdminLogin(null);

                  ${criteria.map(c => `
                    <tr>
                      <td style="font-weight: 700; color: var(--primary);">${c.id}</td>
                      <td><span class="badge badge-info">${c.category}</span></td>
                      <td style="font-weight: 500;">${c.text}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      if (tab === 'courses') {
        return `
          <div>
            <div style="margin-bottom: 1.25rem;">
              <h4 style="font-weight: 700; font-size: 1.1rem;">15 Ders ve Görevli Öğretmenler</h4>
              <p style="font-size: 0.85rem; color: var(--gray-600);">Kurumunuzdaki 15 dersin listesi ve dersi yürüten öğretmenler.</p>
            </div>

            <div class="table-container">
              <table>
                <thead>
                  <tr>
                    <th style="width: 50px;">#</th>
                    <th>Ders Kodu</th>
                    <th>Ders Adı</th>
                    <th>Öğretmen Adı Soyadı</th>
                    <th>Giriş Şifresi</th>
                  </tr>
                </thead>
                <tbody>
                  ${courses.map(c => `
                    <tr>
                      <td style="font-weight: 700;">${c.id}</td>
                      <td><code>${c.code}</code></td>
                      <td style="font-weight: 700; color: var(--dark);">${c.name}</td>
                      <td>${c.teacher}</td>
                      <td><code>ogretmen123</code></td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      if (tab === 'all-results') {
        return `
          <div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 0.75rem;">
              <div>
                <h4 style="font-weight: 700; font-size: 1.1rem;">Tüm Değerlendirme Raporları</h4>
                <p style="font-size: 0.85rem; color: var(--gray-600);">Tüm öğrencilerin ders bazında aldığı puanlar ve öğretmen notları.</p>
              </div>
              <button class="btn btn-success btn-sm" onclick="exportEvaluationsCSV()">
                📊 Excel (CSV) Olarak İndir
              </button>
            </div>

            <div class="table-container">
              <table>
                <thead>
                  <tr>
                    <th>Öğrenci</th>
                    <th>Sınıf</th>
                    <th>Ders</th>
                    <th>Öğretmen</th>
                    <th>Ortalama</th>
                    <th>Öğretmen Notu</th>
                    <th>Tarih</th>
                  </tr>
                </thead>
                <tbody>
                  ${Object.keys(evaluations).length === 0 ? `
                    <tr><td colspan="7" style="text-align: center; color: var(--gray-400); padding: 2rem;">Henüz hiçbir değerlendirme girilmedi.</td></tr>
                  ` : Object.entries(evaluations).map(([key, ev]) => {
                    const [sId, cId] = key.split('_');
                    const st = students.find(s => s.id === sId) || { fullName: 'Bilinmeyen Öğrenci', grade: '-' };
                    const cs = courses.find(c => c.id === parseInt(cId)) || { name: 'Bilinmeyen Ders' };

                    let avg = "-";
                    if (ev.scores && Object.keys(ev.scores).length > 0) {
                      const scs = Object.values(ev.scores);
                      avg = (scs.reduce((a, b) => a + b, 0) / scs.length).toFixed(2);
                    }

                    return `
                      <tr>
                        <td style="font-weight: 700;">${st.fullName}</td>
                        <td>${st.grade}</td>
                        <td><span class="badge badge-info">${cs.name}</span></td>
                        <td>${ev.teacher || cs.teacher}</td>
                        <td style="font-weight: 700; color: var(--primary);">${avg} / 5</td>
                        <td style="max-width: 250px; font-size: 0.85rem; color: var(--gray-700);">${ev.comment || '-'}</td>
                        <td style="font-size: 0.8rem; color: var(--gray-600);">${ev.date || '-'}</td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      return '';
    }

    // Bulk student upload processing
    function loadSampleStudentFormat() {
      document.getElementById('bulk-student-input').value = 
`Burak Koç, 67890123456, 2010-07-14, 8-A, 160
Melis Çakır, 78901234567, 2010-12-03, 8-B, 220
Efe Deniz, 89012345678, 2010-02-18, 8-C, 315
Selin Aktaş, 90123456789, 2010-10-25, 8-A, 172`;
    }

    function processBulkStudents() {
      const text = document.getElementById('bulk-student-input').value.trim();
      if (!text) {
        alert("Lütfen yüklenecek öğrenci listesini kutucuğa yapıştırınız.");
        return;
      }

      const lines = text.split('\n');
      const currentStudents = Store.get('students', []);
      let addedCount = 0;

      lines.forEach((line, index) => {
        const parts = line.split(/[,;\t]/).map(p => p.trim());
        if (parts.length >= 3) {
          const fullName = parts[0];
          const tcNo = parts[1];
          let birthDate = parts[2];
          const grade = parts[3] || "8-A";
          const schoolNo = parts[4] || (200 + currentStudents.length + addedCount).toString();

          // Standardize date to YYYY-MM-DD
          if (birthDate.includes('.')) {
            const dParts = birthDate.split('.');
            if (dParts.length === 3) {
              birthDate = `${dParts[2]}-${dParts[1].padStart(2, '0')}-${dParts[0].padStart(2, '0')}`;
            }
          }

          if (fullName && tcNo) {
            currentStudents.push({
              id: (Date.now() + index).toString(),
              fullName,
              tcNo,
              birthDate,
              grade,
              schoolNo
            });
            addedCount++;
          }
        }
      });

      Store.set('students', currentStudents);
      showToast(`${addedCount} adet yeni öğrenci başarıyla yüklendi!`);
      renderApp();
    }

    function deleteStudent(id) {
      if (confirm("Bu öğrenciyi silmek istediğinize emin misiniz?")) {
        let students = Store.get('students', []);
        students = students.filter(s => s.id !== id);
        Store.set('students', students);
        showToast("Öğrenci silindi.");
        renderApp();
      }
    }

    function clearAllStudents() {
      if (confirm("DİKKAT: Tüm kayıtlı öğrenciler silinecek! Onaylıyor musunuz?")) {
        Store.set('students', []);
        Store.set('evaluations', {});
        showToast("Tüm öğrenciler temizlendi.");
        renderApp();
      }
    }

    // Modal to bulk edit criteria
    function openCriteriaBulkEditModal() {
      const criteria = Store.get('criteria', []);
      const modalContainer = document.getElementById('modal-container');
      modalContainer.style.display = 'flex';
      modalContainer.className = 'modal-overlay';

      const defaultText = criteria.map(c => `${c.id}. [${c.category}] ${c.text}`).join('\n');

      modalContainer.innerHTML = `
        <div class="modal-content">
          <div class="card-header">
            <h2 style="font-size: 1.3rem; font-weight: 700;">25 Kriteri Toplu Düzenle / Yükle</h2>
            <button class="btn btn-secondary btn-sm" onclick="closeModal()">✕</button>
          </div>

          <p style="font-size: 0.875rem; color: var(--gray-600); margin-bottom: 1rem;">
            Aşağıdaki metin alanında kriterleri satır satır düzenleyebilirsiniz. Format: <strong>[Kategori] Kriter Açıklaması</strong>
          </p>

          <div class="form-group">
            <textarea id="bulk-criteria-text" class="form-control" rows="16" style="font-family: monospace; font-size: 0.85rem;">${defaultText}</textarea>
          </div>

          <div style="display: flex; justify-content: flex-end; gap: 0.75rem;">
            <button class="btn btn-secondary" onclick="closeModal()">İptal</button>
            <button class="btn btn-primary" onclick="saveBulkCriteria()">Kaydet ve Güncelle</button>
          </div>
        </div>
      `;
    }

    function saveBulkCriteria() {
      const text = document.getElementById('bulk-criteria-text').value.trim();
      const lines = text.split('\n').filter(l => l.trim().length > 0);

      const newCriteria = [];
      lines.forEach((line, idx) => {
        let clean = line.replace(/^\d+[\.\)]\s*/, '').trim();
        let cat = "Genel Değerlendirme";
        let cText = clean;

        const match = clean.match(/\[(.*?)\]\s*(.*)/);
        if (match) {
          cat = match[1];
          cText = match[2];
        }

        newCriteria.push({
          id: idx + 1,
          category: cat,
          text: cText
        });
      });

      Store.set('criteria', newCriteria);
      closeModal();
      showToast(`${newCriteria.length} adet kriter başarıyla güncellendi!`);
      renderApp();
    }

    // Export System Data
    function exportSystemData() {
      const data = {
        students: Store.get('students', []),
        courses: Store.get('courses', []),
        criteria: Store.get('criteria', []),
        evaluations: Store.get('evaluations', {})
      };

      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ogrenci_degerlendirme_yedek_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast("Tüm sistem verileri JSON olarak indirildi.");
    }

    function exportEvaluationsCSV() {
      const students = Store.get('students', []);
      const courses = Store.get('courses', []);
      const evaluations = Store.get('evaluations', {});

      let csv = "Öğrenci Adı Soyadı;TC No;Sınıf;Okul No;Ders Adı;Öğretmen;Ortalama Puan;Öğretmen Notu;Tarih\n";

      Object.entries(evaluations).forEach(([key, ev]) => {
        const [sId, cId] = key.split('_');
        const st = students.find(s => s.id === sId) || { fullName: 'Bilinmeyen', tcNo: '-', grade: '-', schoolNo: '-' };
        const cs = courses.find(c => c.id === parseInt(cId)) || { name: 'Bilinmeyen Ders', teacher: '-' };

        let avg = "-";
        if (ev.scores && Object.keys(ev.scores).length > 0) {
          const scs = Object.values(ev.scores);
          avg = (scs.reduce((a, b) => a + b, 0) / scs.length).toFixed(2);
        }

        const comm = (ev.comment || "").replace(/;/g, ",").replace(/\n/g, " ");
        csv += `${st.fullName};${st.tcNo};${st.grade};${st.schoolNo};${cs.name};${ev.teacher || cs.teacher};${avg};"${comm}";${ev.date || '-'}\n`;
      });

      const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ogrenci_degerlendirme_sonuclari_${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      showToast("CSV dosyası indirildi.");
    }

    // Initial render
    renderApp();
  </script>
</body>
